[project]
name = "mesh-lens"
version = "0.1.0"
description = "Local-first Skill Mesh telemetry inventory and analysis (measurement-only; never changes routing)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mesh-lens = "mesh_lens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh_lens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
